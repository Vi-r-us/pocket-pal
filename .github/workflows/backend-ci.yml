name: Backend CI
on:
  push:
    branches: [develop, main]
    paths: ['backend/**','.github/workflows/backend-ci.yml']
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pocketpal_test
          POSTGRES_USER: pocketpal
          POSTGRES_PASSWORD: pocketpal
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pocketpal"
          --health-interval=10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test
      - name: Build Docker image
        run: docker build -t pocketpal-backend ./backend
