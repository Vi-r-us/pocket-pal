name: Backend CI
on:
  push:
    branches: [develop, prod]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://pocketpal:pocketpal@localhost:5432/pocketpal_test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pocketpal_test
          POSTGRES_USER: pocketpal
          POSTGRES_PASSWORD: pocketpal
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pocketpal"
          --health-interval=10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test
      # Docker build step removed until Dockerfile is added (see plan Option B)
